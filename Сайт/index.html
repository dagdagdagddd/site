<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedTech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="logo" href="#">
                <span class="logo__mark">
                    <img src="images/Group.png">
                </span>
                <span class="logo__text">LINKEDTECH</span>
            </a>

            <nav class="nav">
                <a href="#">HOME <span class="chevron"></span></a>
                <a href="#">ABOUT <span class="chevron"></span></a>
                <a href="#">PRODUCT <span class="chevron"></span></a>
                <a href="#">BLOG <span class="chevron"></span></a>
                <a href="#">SHOP <span class="chevron"></span></a>
                <a href="#">CONTACT US</a>
            </nav>

            <div class="header__icons">
                <a class="iconlink search">
                    <img src="images/Group 10.png" alt="">
                </a>
                <a class="iconlink cart-icon">                                              
                    <img src="images/Group 51.png">
                </a>
                <a class="iconlink user-icon">
                    <img src="images/Group 15.png" alt="">
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero container">
            <div class="hero__content">
                <p class="eyebrow">FAVORITE BRANDS</p>
                <h1><span>An exciting place</span><br>for the whole family<br>to shop.</h1>
                <p class="description">The standard chunk of Lorem Ipsum used since the 1500s is<br class="desktop-break"> reproduced below for those interested.</p>
                <div class="hero__actions">
                    <a class="button" href="#">SHOP NOW</a>
                    <div class="price">$ 249.99 <del>$249.99</del></div>
                </div>
            </div>

            <div class="hero__visual">
                <div class="image-placeholder">
                    <img src="images/hero-product.png" alt="">
                </div>
            </div>
        </section>

        <section class="brands container">
            <div class="brand brand--sunshine">
                <img src="images/cl_logo4.png" alt="">
            </div>
            <div class="brand brand--pure">
                <img src="images/cl_logo5.png" alt="">
            </div>
            <div class="brand brand--auto">
                <img src="images/cl_logo7.png" alt="">
            </div>
            <div class="brand brand--hand">
                <img src="images/cl_logo2.png" alt="">
            </div>
        </section>
    </main>
</body>
</html>
